[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MacroDataHub"
version = "0.1.0"
description = "Framework for ingestion, processing, and distribution of macroeconomic data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Matheus Belmar", email = "matheusleal2596@gmail.com"}
]
dependencies = [
    "requests",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "responses",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 88